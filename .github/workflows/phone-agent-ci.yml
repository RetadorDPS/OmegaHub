name: Phone Agent CI

# Verifica las piezas web, Android, Edge Functions y SQL en cada push. Cada job
# es independiente: un fallo del SQL no impide ver si pasa el test web.
on:
  push:
    paths:
      - 'phone-agent/**'
      - 'phone-agent-web/**'
      - 'scripts/build-pages.mjs'
      - '.github/workflows/phone-agent-ci.yml'
  pull_request:
    paths:
      - 'phone-agent/**'
      - 'phone-agent-web/**'
      - 'scripts/build-pages.mjs'
      - '.github/workflows/phone-agent-ci.yml'
  workflow_dispatch:

# Separa ejecuciones por ref y evento para evitar cancelaciones cruzadas.
concurrency:
  group: phone-agent-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # ── Web: regresiones del parser y final real de respuestas ────────────────
  web:
    name: Web · parser + espera de respuesta completa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sintaxis JavaScript
        run: |
          node --check phone-agent-web/userscript/phone-agent.user.js
          node --check phone-agent-web/panel/app.js
          node --check scripts/build-pages.mjs

      - name: 'Parser: dos copias, mismos casos'
        run: node phone-agent-web/tests/parser.test.mjs

      - name: 'Respuesta: pausa, final y timeout'
        run: node phone-agent-web/tests/completion.test.mjs

  # ── Android: tests de JVM + APK de debug ──────────────────────────────────
  android:
    name: Android · tests unitarios + assembleDebug
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: phone-agent/android-app
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # El wrapper de Gradle no se versiona (gradle-wrapper.jar es un binario),
      # así que CI instala Gradle directamente. 8.7 es el mínimo que AGP 8.5.2
      # acepta.
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar firma estable del APK actualizable
        id: stable_signing
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.PHONE_AGENT_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.PHONE_AGENT_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEYSTORE_BASE64" ] || [ -z "$SIGNING_KEYSTORE_PASSWORD" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No hay firma persistente. Los pushes normales solo compilan el APK; una publicación manual será de prueba y requerirá desinstalar la versión que tenga otra firma."
            echo "Este build no publica APK automáticamente. En una ejecución manual se puede publicar una APK de prueba con firma temporal; hay que desinstalar una versión con otra firma." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          signing_file="$RUNNER_TEMP/phone-agent-test-signing.p12"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$signing_file"
          chmod 600 "$signing_file"
          {
            echo "PHONE_AGENT_SIGNING_KEYSTORE_PATH=$signing_file"
            echo "PHONE_AGENT_SIGNING_KEYSTORE_PASSWORD=$SIGNING_KEYSTORE_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # El APK de prueba usa los valores públicos del backend compartido
      # definidos como fallback en app/build.gradle.kts. No inyectar placeholders.

      - name: Compilar APK de debug para probar en el teléfono
        id: assemble
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace assembleDebug > gradle-build.log 2>&1
          result=$?
          tail -n 70 gradle-build.log
          if [ "$result" -ne 0 ]; then
            {
              echo '### Error al compilar el APK'
              echo '```text'
              tail -n 100 gradle-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E '(^e: |error:|FAILURE:|What went wrong:|Execution failed|Could not|Required by|Searched in|Caused by:|No matching variant|failed to resolve)' gradle-build.log | tail -n 30 | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done < deno-check.log
            exit "$result"
          fi

      - name: Descargar diagnóstico de compilación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostics
          path: phone-agent/android-app/gradle-build.log
          if-no-files-found: ignore
          retention-days: 7

      # APK debug sin claves secretas ni firma de publicación. Solo incluye la
      # URL y la clave pública publishable del backend compartido; sirve para prueba.
      - name: Descargar APK de prueba
        if: steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: phone-agent-debug-apk
          path: phone-agent/android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      # Los pushes normales solo reemplazan el asset si está configurada la firma estable.
      # Una ejecución manual puede publicar una APK de prueba con la firma debug temporal,
      # para probarla tras desinstalar la versión anterior si Android detecta otra firma.
      - name: Publicar APK de prueba con enlace directo
        if: github.ref == 'refs/heads/arena/95f82923-omegahub' && steps.assemble.outcome == 'success' && (steps.stable_signing.outputs.ready == 'true' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_SIGNING_READY: ${{ steps.stable_signing.outputs.ready }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="phone-agent-test-${GITHUB_RUN_NUMBER}"
          if [ "$STABLE_SIGNING_READY" = "true" ]; then
            signing_note="firma estable configurada"
          else
            signing_note="firma debug temporal de GitHub Actions; puede requerir desinstalar otra firma antes de instalar"
            echo "APK de prueba publicada con firma debug temporal. Si Android rechaza la actualización, desinstala primero Phone Agent; la sesión de cuenta se conserva en el backend, pero permisos y datos locales pueden requerir configuración de nuevo." >> "$GITHUB_STEP_SUMMARY"
          fi
          notes="APK de prueba compilada desde ${GITHUB_SHA}. ${signing_note}. Para instalarla, descarga app-debug.apk; si Android dice que el paquete entra en conflicto, desinstala la versión anterior y vuelve a instalarla."
          gh release create "$release_tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Phone Agent 1.0.${GITHUB_RUN_NUMBER} — APK de prueba" --notes "$notes"
          gh release upload "$release_tag" app/build/outputs/apk/debug/app-debug.apk --repo "$GITHUB_REPOSITORY"

      - name: Tests unitarios (lógica de seguridad, macros, modelos)
        if: steps.assemble.outcome == 'success'
        run: gradle --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee gradle-tests.log

      - name: Resultados y diagnóstico de los tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            phone-agent/android-app/app/build/reports/tests/
            phone-agent/android-app/gradle-tests.log
          if-no-files-found: ignore

  # ── Edge Functions: Deno ──────────────────────────────────────────────────
  edge-functions:
    name: Edge Functions · deno check + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phone-agent/supabase
    steps:
      - uses: actions/checkout@v4

      - name: Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # deno check instala los imports npm: y verifica tipos. Es lo mismo
      # que `supabase functions deploy` hace antes de subir.
      - name: Verificar tipos
        shell: bash
        run: |
          set +e
          deno check functions/*/*.ts > deno-check.log 2>&1
          result=$?
          cat deno-check.log
          if [ "$result" -ne 0 ]; then
            {
              echo '### Error en deno check'
              echo '```text'
              cat deno-check.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done < deno-check.log
            exit "$result"
          fi

      - name: Lint
        run: deno lint functions/

  # ── SQL: se aplica de verdad contra Postgres ──────────────────────────────
  sql:
    name: Supabase · aplicar migración + seed
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: phone_agent
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: phone_agent
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar fixture de auth/storage + migración
        working-directory: phone-agent/supabase
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f ci/000_auth_stub.sql
          psql -v ON_ERROR_STOP=1 -f migrations/001_full_schema.sql

      # Si la migración se aplica pero el seed no, el agente arranca sin apps
      # autorizadas y el fallo es muy confuso de diagnosticar. Se comprueba aquí.
      - name: Ejecutar el seed global
        working-directory: phone-agent/supabase
        run: psql -v ON_ERROR_STOP=1 -c "select public.seed_initial_data();"

      - name: Comprobar el vocabulario de acciones y el seed
        working-directory: phone-agent/supabase
        run: |
          set -euo pipefail
          # Las 4 apps del MVP deben estar sembradas.
          drivers=$(psql -tA -c "select count(*) from app_drivers where user_id is null;")
          test "$drivers" = "4" || { echo "esperados 4 drivers, hay $drivers"; exit 1; }

          # allowed_actions lleva 13, no 15: 'done' y 'request_confirmation' son
          # meta-acciones que PermissionGate resuelve ANTES de consultar la
          # lista (PermissionGate.kt líneas 45-51, frente al allows() de la 70),
          # así que declararlos aquí no tendría efecto. Si este número cambia,
          # hay que cambiar a la vez DriverConfig.DEFAULT_ACTIONS.
          incompletos=$(psql -tA -c "select count(*) from app_drivers
            where jsonb_array_length(allowed_actions) <> 13;")
          test "$incompletos" = "0" || { echo "$incompletos filas sin las 13 acciones"; exit 1; }

          # app_kind decide si ENTER cuenta como envío: sin él, el guardián
          # trataría un envío de WhatsApp como una tecla inocente.
          kinds=$(psql -tA -c "select count(*) from app_drivers
            where ui_map ? 'app_kind';")
          test "$kinds" = "4" || { echo "esperados 4 app_kind, hay $kinds"; exit 1; }

          # WhatsApp es mensajería; los asistentes no.
          wa=$(psql -tA -c "select ui_map->>'app_kind' from app_drivers where driver_key='whatsapp';")
          test "$wa" = "messaging" || { echo "whatsapp debería ser messaging, es '$wa'"; exit 1; }

          # RLS activo en todas las tablas del producto.
          sin_rls=$(psql -tA -c "select count(*) from pg_tables
            where schemaname='public' and rowsecurity=false
              and tablename in ('users','app_drivers','projects','agent_sessions',
                                'session_steps','macros','capability_config','event_log');")
          test "$sin_rls" = "0" || { echo "$sin_rls tablas sin RLS"; exit 1; }

          # El bucket de screenshots y su borrado a 24 h.
          bucket=$(psql -tA -c "select count(*) from storage.buckets where id='screenshots';")
          test "$bucket" = "1" || { echo "falta el bucket screenshots"; exit 1; }
          psql -v ON_ERROR_STOP=1 -c "select public.delete_old_screenshots();"

          echo "Migración, seed y RLS verificados ✅"
