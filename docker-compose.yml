# ============================================================================
#  TrendHunter Pro · stack completo (app + PostgreSQL + Redis)
# ----------------------------------------------------------------------------
#  Arranque:   docker compose up --build
#  Migración:  docker compose exec app npm run db:push
#  Datos demo: docker compose exec app npm run db:seed
# ============================================================================

services:
  app:
    build:
      context: .
      # El cliente de Prisma se genera al compilar para el motor elegido.
      args:
        DATABASE_PROVIDER: ${DATABASE_PROVIDER:-postgresql}
    container_name: trendhunter-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_PROVIDER: ${DATABASE_PROVIDER:-postgresql}
      # Con Supabase (recomendado) estas dos variables vienen del .env:
      #   DATABASE_URL = pooler (6543)   ·   DIRECT_URL = conexión directa (5432)
      # Si no se definen, se usa el PostgreSQL de este mismo compose.
      DATABASE_URL: ${DATABASE_URL:-postgresql://trendhunter:trendhunter@postgres:5432/trendhunter?schema=public}
      DIRECT_URL: ${DIRECT_URL:-postgresql://trendhunter:trendhunter@postgres:5432/trendhunter?schema=public}
      AUTO_SEED: ${AUTO_SEED:-true}
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:-cambia-esto-en-produccion-32-bytes-minimo}
      NEXTAUTH_SECRET: ${AUTH_SECRET:-cambia-esto-en-produccion-32-bytes-minimo}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      # Integraciones opcionales (se pueden omitir sin romper la aplicación):
      AI_PROVIDER: ${AI_PROVIDER:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      args:
        DATABASE_PROVIDER: ${DATABASE_PROVIDER:-postgresql}
    container_name: trendhunter-worker
    restart: unless-stopped
    command: ["npx", "tsx", "scripts/worker.ts"]
    environment:
      DATABASE_PROVIDER: ${DATABASE_PROVIDER:-postgresql}
      DATABASE_URL: ${DATABASE_URL:-postgresql://trendhunter:trendhunter@postgres:5432/trendhunter?schema=public}
      DIRECT_URL: ${DIRECT_URL:-postgresql://trendhunter:trendhunter@postgres:5432/trendhunter?schema=public}
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:-cambia-esto-en-produccion-32-bytes-minimo}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: trendhunter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: trendhunter
      POSTGRES_PASSWORD: trendhunter
      POSTGRES_DB: trendhunter
    ports:
      - "5432:5432"
    volumes:
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trendhunter -d trendhunter"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trendhunter-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - datos-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  datos-postgres:
  datos-redis:
